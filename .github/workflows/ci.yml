name: CI

on:
  push:
    branches: [master]
  pull_request:
  # An advisory published tomorrow will not wait for the next push.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      # cgo stays on here: the race detector needs it.
      - name: test
        run: go test -race ./...

      - name: build
        run: go build -ldflags '-s -w' -o trackerd ./cmd/trackerd
        env:
          CGO_ENABLED: 0

  vuln:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Reachability analysis rather than a dependency-graph scan: it fails
      # only on advisories this code can actually reach, so a failure here is
      # worth acting on. Graph scanners flag every CVE in the module list,
      # including modules pruned before they reach the binary.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  ui:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Same major as the development machines, so the build below is
      # byte-identical to the committed one and the drift check is meaningful.
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run build
        working-directory: web

      # web/dist is committed so `go build` works without Node installed.
      # Catch the case where web/src changed but `make ui` was not run.
      - name: web/dist is up to date
        run: |
          if [ -n "$(git status --porcelain -- web/dist)" ]; then
            echo "web/dist is stale - run 'make ui' and commit the result:"
            git status --porcelain -- web/dist
            exit 1
          fi
