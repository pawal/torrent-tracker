<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f6f9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1117" />

    <!-- Defaults for the dashboard. trackerd substitutes each page's own
         metadata for them before serving, and meta.js keeps them current as
         the client navigates. One tag per line: the substitution matches whole
         attribute values, so a wrapped tag would be missed. -->
    <title>torrent-tracker — BitTorrent tracker DNS history</title>
    <meta name="description" content="Which BitTorrent trackers still answer, and where they live. Hourly DNS collection, BEP 15 and BEP 48 probes, and an append-only feed of every change." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://tracker.evilbit.de/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="torrent-tracker" />
    <meta property="og:title" content="torrent-tracker — BitTorrent tracker DNS history" />
    <meta property="og:description" content="Which BitTorrent trackers still answer, and where they live. Hourly DNS collection, BEP 15 and BEP 48 probes, and an append-only feed of every change." />
    <meta property="og:url" content="https://tracker.evilbit.de/" />
    <meta property="og:image" content="https://tracker.evilbit.de/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="torrent-tracker — tracker uptime intervals" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="torrent-tracker — BitTorrent tracker DNS history" />
    <meta name="twitter:description" content="Which BitTorrent trackers still answer, and where they live. Hourly DNS collection, BEP 15 and BEP 48 probes, and an append-only feed of every change." />
    <meta name="twitter:image" content="https://tracker.evilbit.de/og-image.png" />

    <!-- trackerd renders every page into the body as plain HTML too, for text
         browsers and crawlers. A browser that runs the bundle marks the document
         and the rule below takes that copy away; lynx runs neither and keeps it. -->
    <script>
      document.documentElement.classList.add('js')
      // A bundle that never loads would otherwise leave the empty div and no
      // page at all. Capture: a failed script tag fires no bubbling event.
      addEventListener(
        'error',
        (e) => {
          if (e.target?.tagName === 'SCRIPT') document.documentElement.classList.remove('js')
        },
        true,
      )
    </script>
    <style>
      .js #fallback {
        display: none;
      }
      #fallback {
        margin: 0 auto;
        max-width: 60rem;
        padding: 1rem;
        font-family: system-ui, sans-serif;
        line-height: 1.5;
      }
      #fallback table {
        border-collapse: collapse;
      }
      #fallback td,
      #fallback th {
        border-bottom: 1px solid #ccc;
        padding: 0.2rem 0.6rem 0.2rem 0;
        text-align: left;
        vertical-align: top;
      }
      #fallback th[scope='row'] {
        font-weight: 600;
        padding-right: 1.5rem;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
